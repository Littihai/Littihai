name: Generate Snake
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

# GitHub runs workflows only from .github/workflows/, and the job pushes the SVGs
# to the `output` branch, so it needs write access to the repository contents
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # growing snake: +1 segment for the lightest green day up to +4 for the darkest
      - name: Draw the growing snake
        run: node scripts/growing-snake.mjs --user=${{ github.repository_owner }} --out=dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
